name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financial_analyst_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install import-linter

      - name: Structure check
        run: python scripts/check_structure.py

      - name: Import contracts
        run: lint-imports

      - name: Unit tests
        run: pytest -q --cov=shared --cov-fail-under=85

      - name: Ruff
        run: ruff check shared tests scripts

      - name: Secret scan (if gitleaks available)
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source .. --verbose --no-banner
          else
            echo "gitleaks not installed — skipping (install in pre-commit for local)"
          fi
