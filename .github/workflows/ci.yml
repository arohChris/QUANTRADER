name: CI

# WHY master: the local repo's only branch is `master` (no remote configured).
# Triggering on `main` alone meant this workflow had never executed once —
# every "green" status was an assumption, not a run.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# WHY least privilege: this workflow only reads the repo and reports.
permissions:
  contents: read

# WHY: rapid pushes on one branch should cancel superseded runs, so a red X
# always refers to the current tip and not a stale queue position.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: financial_analyst_app
    steps:
      # Pinned to full commit SHAs (tags are mutable — supply-chain pin).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # WHY full history: gitleaks scans the git log, not just the worktree.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # --- Guardrails (AGENTS §8) — cheap gates first so they fail fast. ---

      - name: Structure guard
        run: python scripts/check_structure.py

      - name: Naming guard
        run: python scripts/check_naming.py

      - name: Build-order guard (G0 before M6, P15 before P22)
        run: python scripts/check_build_order.py

      - name: PIT guard (no direct Lake bypass from alpha)
        run: python scripts/check_pit_guard.py

      - name: Retention guard (no cold AnalyticsResult writes)
        run: python scripts/check_retention.py

      - name: Import contracts
        run: lint-imports

      # WHY modules+app: the workflow previously linted only shared/tests/scripts,
      # so the code that actually ships (modules/, app/) was never checked.
      - name: Ruff
        run: ruff check shared modules app tests scripts

      # WHY --cov=modules: AGENTS §8 coverage floor covers the shipping tree,
      # not just the shared library.
      - name: Unit tests
        run: pytest -q --cov=shared --cov=modules --cov-fail-under=85

      # WHY installed instead of "if available": a conditionally-skipped secret
      # scan never fails — it can only ever report success.
      - name: Secret scan (gitleaks, blocking)
        run: |
          set -euo pipefail
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source .. --redact --no-banner --exit-code 1 --verbose
