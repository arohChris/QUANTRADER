[project]
name = "financial-analyst-app"
version = "0.1.0"
description = "Institutional Hedge Fund Grade Algo Trading Platform — M1 Foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "cryptography>=42.0",  # for Fernet vault — fallback to base64 if missing
    "anyio>=4.0",
    "websockets>=12.0",  # M2.1 connection — async WS client (P08)
    "fastapi>=0.110",  # M10.2 thin API — account mode switch
    "uvicorn>=0.27",  # serve app.main + frontend
    "pyarrow>=14",  # M2.8 parquet lake (spec Step 5)
    "redis>=5.0",  # M2.9 HOT cache — redis-py client for Valkey (driver locked by human 2026-09-25)
    "asyncpg>=0.29",  # M2.10 WARM durable store — async postgres driver (tests inject fakes; only live verify needs it)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "ruff>=0.6",
    "httpx>=0.27",  # FastAPI TestClient for M10.2 API tests
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# WHY importlib: human naming uses dots (test_m2.3_spec.py) — default mode
# treats dots as package separators → "No module named 'test_m2'".
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

# WHY pin first-party explicitly: ruff's src detection classifies a package
# only while it exists on disk — modules.m4_alpha is imported by its spec
# tests BEFORE Step 5 creates it (AGENTS §2 test-first). Without this pin the
# import block would silently re-sort the day the package appears, churning a
# frozen test file mid-slice. Pin = same import order today and after Step 5.
[tool.ruff.lint.isort]
known-first-party = ["modules", "shared"]

[tool.coverage.run]
source = ["shared"]

[tool.importlinter]
root_package = "financial_analyst_app"
include_external_packages = true

# Enforce Bible §33 — no reverse imports (contracts/core never import modules)
[[tool.importlinter.contracts]]
name = "M1 never imports modules"
type = "forbidden"
source_modules = ["shared.contracts", "shared.core"]
forbidden_modules = ["modules"]

[[tool.importlinter.contracts]]
name = "Intelligence never trades"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["modules.execution", "modules.trust"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
