# M2b — Forex assets — read by instrument_master + symbol_mapping
# v1.4 canonical_instrument_id is primary key (FX.EURUSD), symbol is display alias
# broker_native: multi-broker map — needed so to_canonical("frxEURUSD","deriv") has a source.
FX.EURUSD:
  canonical_symbol: EURUSD
  display_name: EURUSD
  asset_class: forex
  pip: 0.0001
  tick_size: "0.00001"
  contract_size: "100000"
  min_qty: "0.001"
  qty_step: "0.001"
  brokers: [deriv, mt5, headway]
  broker_native:
    deriv: frxEURUSD
    mt5: EURUSD
    headway: EURUSD
  # versioning: effective_from allows historical changes
  # e.g., on 2026-06-01 min_qty changed 0.001->0.002 via new snapshot
FX.GBPUSD:
  canonical_symbol: GBPUSD
  display_name: GBPUSD
  asset_class: forex
  pip: 0.0001
  tick_size: "0.00001"
  contract_size: "100000"
  min_qty: "0.001"
  qty_step: "0.001"
  brokers: [deriv, mt5]
  broker_native:
    deriv: frxGBPUSD
    mt5: GBPUSD

# --- UNIVERSE SCREEN ADDITION 2026-09-29 (human LGTM "lgtm") -------------------------
# WHY: the 25-asset universe appears in five spec/doc places (m2b.4_trading_calendar
# .spec.md:147,166; m2.6_gap_calendar.spec.md:157,167; BUILD_STATUS.md:457) and sized
# three design decisions, but only 2 forex instruments were ever configured. The 19
# below were DERIVED, not hand-picked: scripts/verify_m2b.7_universe_screen.py ranks the
# live `active_symbols.trade_count` and the selection is written to
# config/reference/universe_screen.json with its `screened_at` timestamp.
#
# WHY `pip`/`tick_size` are derived from the broker's OWN `pip_size` and NOT hardcoded:
# the live call returns 1e-05 for most pairs and 0.001 for the JPY crosses. A fixed
# 0.00001 tick on USDJPY is a 100x error in the same shape as the BTC/XAG pip_size defect
# this project already found and fixed (see BUILD_STATUS.md D-pip_size). The venue is
# the authority on its own tick quantum (scale_from_pip_size).
#
# WHY `min_qty` is 0.01 here while EURUSD/GBPUSD above say 0.001: 0.01 is what Deriv's
# own specification table states for the STANDARD pairs ("Min size 0.01"). The two
# pre-existing entries are NOT changed by this slice - the discrepancy is recorded as an
# OPEN QUESTION rather than silently edited, because it is not this slice's call.
#
# WHY `contract_size` is quoted: the strict money law (D13) forbids bare YAML numbers in
# a money field, because a bare number is already a float by the time it is read.
FX.AUDUSD:  {canonical_symbol: AUDUSD,  display_name: AUDUSD, asset_class: forex, pip: 0.0001, tick_size: "0.00001", contract_size: "100000", min_qty: "0.01", qty_step: "0.01", brokers: [deriv, mt5], broker_native: {deriv: frxAUDUSD,  mt5: AUDUSD}}
FX.USDCAD:  {canonical_symbol: USDCAD,  display_name: USDCAD, asset_class: forex, pip: 0.0001, tick_size: "0.00001", contract_size: "100000", min_qty: "0.01", qty_step: "0.01", brokers: [deriv, mt5], broker_native: {deriv: frxUSDCAD,  mt5: USDCAD}}
