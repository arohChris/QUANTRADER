# Root import-linter configuration.
#
# WHY THIS FILE EXISTS (2026-09-27): CI (`.github/workflows/ci.yml:65`) runs `lint-imports`
# from the REPOSITORY ROOT, but the only config lived in
# `financial_analyst_app/pyproject.toml` — a directory import-linter does not search when
# invoked from the root. The gate therefore exited 1 with "Could not read any configuration",
# and separately `python -m importlinter.cli` is a NO-OP (that module has no `main`), so
# every recorded "lint-imports exit 0" in BUILD_STATUS was vacuous. The dependency-direction
# law has never actually been enforced.
#
# `setup.cfg` is used rather than a root `pyproject.toml` deliberately: adding a
# pyproject.toml at the root would change packaging/rootdir discovery for the backend suite
# and the frontend runner. A setup.cfg with only an [importlinter] section has no such
# effect.
#
# The decoy `financial_analyst_app/.importlinter` was removed: import-linter ignores it
# whenever a [tool.importlinter] section exists, so two configs meant one was always dead.

[importlinter]
root_package = financial_analyst_app
include_external_packages = True

# --- Bible 33: dependency direction. shared never imports modules. ---
[importlinter:contract:core-and-contracts-never-import-modules]
name = shared.core and shared.contracts must never import modules (directionality is law - 33)
type = forbidden
source_modules =
    financial_analyst_app.shared.core
    financial_analyst_app.shared.contracts
forbidden_modules = financial_analyst_app.modules

# --- Contracts are leaves: nothing below them, and never the web entry point. ---
[importlinter:contract:contracts-are-leaf]
name = shared.contracts must never import shared.core, modules, or app
type = forbidden
source_modules = financial_analyst_app.shared.contracts
forbidden_modules =
    financial_analyst_app.shared.core
    financial_analyst_app.modules
    financial_analyst_app.app

# --- The dependency on the web entry point points one way only. ---
[importlinter:contract:modules-never-import-app]
name = Domain modules must never import the web entry point (app/)
type = forbidden
source_modules = financial_analyst_app.modules
forbidden_modules = financial_analyst_app.app

# --- The API plane must not reach into another module's internals. This is the guard that
# --- stops a future gateway router from bypassing the frozen contracts (AGENTS.md 5).
[importlinter:contract:experience-api-never-imports-data-internals]
name = API plane (modules/experience/api) must not import another module's internals
type = forbidden
source_modules = financial_analyst_app.modules.experience.api
forbidden_modules =
    financial_analyst_app.modules.m2_market_data.hot
    financial_analyst_app.modules.m2_market_data.warm
    financial_analyst_app.modules.m2_market_data.storage
    financial_analyst_app.modules.m3_analytics.engine
    financial_analyst_app.modules.m4_alpha.strategy
    financial_analyst_app.modules.m4_alpha.signal

# --- Intelligence must never trade. ---
[importlinter:contract:intelligence-never-trades]
name = Intelligence must never import execution or trust modules
type = forbidden
source_modules = financial_analyst_app.shared
forbidden_modules =
    financial_analyst_app.modules.execution
    financial_analyst_app.modules.trust
